name: Test

on:
  push:
    branches:
      - aws-project  # LAB BRANCH

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: aws-project
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install -r app/requirements_flask.txt
      - name: Run tests
        run: pytest
      - name: Dispatch Lambda deployment
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: lambda.yml
          ref: aws-project    